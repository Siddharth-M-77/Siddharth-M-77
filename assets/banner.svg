<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Siddharth Maddheshiya - Backend Engineer, Web3 and FinTech Systems">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03040a"/>
      <stop offset="70%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#101a3a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a2e"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <!-- Animated shimmer for the name -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="65%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#34d399"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="faceT" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#0f2744"/></linearGradient>
    <linearGradient id="faceL" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1f3a"/><stop offset="100%" stop-color="#070f1f"/></linearGradient>
    <linearGradient id="faceR" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#091629"/><stop offset="100%" stop-color="#040912"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="1" r="0.6">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.15"/><stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="floorMask"><rect x="0" y="292" width="1200" height="148" fill="url(#fadeFloor)"/></mask>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/><feColorMatrix in="b" type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.83  0 0 0 0 0.93  0 0 0 0.45 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="typeClip"><rect x="76" y="256" height="30" width="0">
      <animate attributeName="width" values="0;470;470;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="frame"><rect width="1200" height="440" rx="20"/></clipPath>
    <style>
      .name { font: 800 58px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1.5px; }
      .role { font: 500 21px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #a5b4cb; }
      .mono { font: 600 16px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #34d399; }
      .hash { font: 700 13px 'SFMono-Regular', Consolas, monospace; fill: #e0f2fe; }
      .tiny { font: 600 9px 'SFMono-Regular', Consolas, monospace; fill: #64748b; }
      .tag  { font: 600 12px 'SFMono-Regular', Consolas, monospace; fill: #94a3b8; letter-spacing: 2px; }
      .grid path, .grid line { stroke: #22d3ee; stroke-width: 1.2; fill: none; }
      .h { animation: fwd 4.5s cubic-bezier(.55,0,.9,.45) infinite; }
      @keyframes fwd { from { transform: translateY(0); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(148px); opacity: 1; } }
      .s { animation: tw 4s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .1; } 50% { opacity: 1; } }
      /* Floating blocks */
      .float { animation: bob 4s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      .shadow { animation: shade 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes shade { 0%,100% { opacity: .35; transform: translateY(0) scale(1); } 50% { opacity: .12; transform: translateY(14px) scale(.75); } }
      /* Edge flash = block being 'mined' */
      .edge { animation: flash 3.6s ease-in-out infinite; }
      @keyframes flash { 0%,70%,100% { opacity: 0; } 80% { opacity: .9; } }
      /* Data packets running along the chain */
      .link { stroke-dasharray: 4 10; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      .in  { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .4s } .d3 { animation-delay: .65s } .d4 { animation-delay: .9s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(480px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#sky)"/>
    <circle class="s" cx="959" cy="92" r="0.7" fill="#67e8f9" style="animation-duration:5.4s;animation-delay:-0.6s"/>
    <circle class="s" cx="571" cy="157" r="1.5" fill="#67e8f9" style="animation-duration:3.0s;animation-delay:-3.2s"/>
    <circle class="s" cx="601" cy="240" r="0.7" fill="#c4b5fd" style="animation-duration:3.1s;animation-delay:-4.1s"/>
    <circle class="s" cx="609" cy="236" r="0.7" fill="#6ee7b7" style="animation-duration:3.6s;animation-delay:-0.4s"/>
    <circle class="s" cx="934" cy="151" r="0.7" fill="#67e8f9" style="animation-duration:3.2s;animation-delay:-0.4s"/>
    <circle class="s" cx="240" cy="158" r="1" fill="#e2e8f0" style="animation-duration:2.8s;animation-delay:-4.0s"/>
    <circle class="s" cx="849" cy="60" r="1" fill="#e2e8f0" style="animation-duration:2.8s;animation-delay:-2.3s"/>
    <circle class="s" cx="95" cy="220" r="1.5" fill="#e2e8f0" style="animation-duration:3.5s;animation-delay:-3.1s"/>
    <circle class="s" cx="1104" cy="275" r="1" fill="#e2e8f0" style="animation-duration:5.4s;animation-delay:-3.9s"/>
    <circle class="s" cx="485" cy="164" r="1.5" fill="#67e8f9" style="animation-duration:3.3s;animation-delay:-2.4s"/>
    <circle class="s" cx="886" cy="217" r="1" fill="#e2e8f0" style="animation-duration:5.8s;animation-delay:-0.2s"/>
    <circle class="s" cx="595" cy="11" r="1" fill="#c4b5fd" style="animation-duration:2.9s;animation-delay:-4.9s"/>
    <circle class="s" cx="1086" cy="194" r="0.7" fill="#c4b5fd" style="animation-duration:5.4s;animation-delay:-3.3s"/>
    <circle class="s" cx="177" cy="150" r="0.7" fill="#c4b5fd" style="animation-duration:5.7s;animation-delay:-4.6s"/>
    <circle class="s" cx="901" cy="162" r="0.7" fill="#c4b5fd" style="animation-duration:3.0s;animation-delay:-4.1s"/>
    <circle class="s" cx="1086" cy="198" r="0.7" fill="#e2e8f0" style="animation-duration:4.8s;animation-delay:-2.3s"/>
    <circle class="s" cx="1037" cy="275" r="0.7" fill="#67e8f9" style="animation-duration:3.3s;animation-delay:-1.0s"/>
    <circle class="s" cx="1005" cy="46" r="0.7" fill="#e2e8f0" style="animation-duration:2.7s;animation-delay:-4.3s"/>
    <circle class="s" cx="805" cy="217" r="1.5" fill="#c4b5fd" style="animation-duration:4.2s;animation-delay:-1.3s"/>
    <circle class="s" cx="1007" cy="29" r="1.5" fill="#c4b5fd" style="animation-duration:3.5s;animation-delay:-1.4s"/>
    <circle class="s" cx="544" cy="53" r="1.5" fill="#c4b5fd" style="animation-duration:2.7s;animation-delay:-0.1s"/>
    <circle class="s" cx="170" cy="25" r="0.7" fill="#67e8f9" style="animation-duration:4.9s;animation-delay:-3.9s"/>
    <circle class="s" cx="198" cy="268" r="1" fill="#6ee7b7" style="animation-duration:4.1s;animation-delay:-2.4s"/>
    <circle class="s" cx="834" cy="217" r="0.7" fill="#c4b5fd" style="animation-duration:5.5s;animation-delay:-1.4s"/>
    <circle class="s" cx="1079" cy="24" r="1.5" fill="#6ee7b7" style="animation-duration:3.6s;animation-delay:-1.0s"/>
    <circle class="s" cx="337" cy="104" r="1.5" fill="#c4b5fd" style="animation-duration:5.9s;animation-delay:-3.8s"/>
    <circle class="s" cx="787" cy="111" r="1.5" fill="#c4b5fd" style="animation-duration:5.9s;animation-delay:-1.3s"/>
    <circle class="s" cx="1165" cy="247" r="1.5" fill="#6ee7b7" style="animation-duration:5.7s;animation-delay:-1.4s"/>
    <circle class="s" cx="124" cy="39" r="1.5" fill="#e2e8f0" style="animation-duration:3.2s;animation-delay:-4.1s"/>
    <circle class="s" cx="748" cy="171" r="1.5" fill="#e2e8f0" style="animation-duration:4.3s;animation-delay:-4.3s"/>
    <circle class="s" cx="1153" cy="34" r="1.5" fill="#67e8f9" style="animation-duration:3.4s;animation-delay:-0.8s"/>
    <circle class="s" cx="1163" cy="17" r="1.5" fill="#c4b5fd" style="animation-duration:2.8s;animation-delay:-3.5s"/>
    <circle class="s" cx="95" cy="128" r="1.5" fill="#e2e8f0" style="animation-duration:2.7s;animation-delay:-3.7s"/>
    <circle class="s" cx="179" cy="114" r="1.5" fill="#e2e8f0" style="animation-duration:4.0s;animation-delay:-0.5s"/>
    <circle class="s" cx="451" cy="36" r="1.5" fill="#6ee7b7" style="animation-duration:5.4s;animation-delay:-4.7s"/>
    <circle class="s" cx="760" cy="233" r="1.5" fill="#e2e8f0" style="animation-duration:2.7s;animation-delay:-2.8s"/>
    <circle class="s" cx="1188" cy="109" r="1.5" fill="#e2e8f0" style="animation-duration:3.1s;animation-delay:-2.4s"/>
    <circle class="s" cx="650" cy="217" r="1" fill="#6ee7b7" style="animation-duration:4.1s;animation-delay:-0.9s"/>
    <circle class="s" cx="693" cy="265" r="1" fill="#67e8f9" style="animation-duration:3.9s;animation-delay:-0.5s"/>
    <circle class="s" cx="943" cy="185" r="1.5" fill="#6ee7b7" style="animation-duration:4.8s;animation-delay:-1.7s"/>

    <!-- Horizon glow -->
    <ellipse cx="600" cy="292" rx="520" ry="150" fill="url(#sun)" class="pulse"/>

    <!-- Perspective floor -->
    <rect x="0" y="292" width="1200" height="148" fill="url(#floor)"/>
    <g class="grid" mask="url(#floorMask)" opacity="0.7">
    <path d="M516 292L-730 440 M522 292L-635 440 M528 292L-540 440 M534 292L-445 440 M540 292L-350 440 M546 292L-255 440 M552 292L-160 440 M558 292L-65 440 M564 292L30 440 M570 292L125 440 M576 292L220 440 M582 292L315 440 M588 292L410 440 M594 292L505 440 M600 292L600 440 M606 292L695 440 M612 292L790 440 M618 292L885 440 M624 292L980 440 M630 292L1075 440 M636 292L1170 440 M642 292L1265 440 M648 292L1360 440 M654 292L1455 440 M660 292L1550 440 M666 292L1645 440 M672 292L1740 440 M678 292L1835 440 M684 292L1930 440"/>
    <line class="h" x2="1200" y1="292" y2="292" style="animation-delay:-0.0s"/>
    <line class="h" x2="1200" y1="292" y2="292" style="animation-delay:-0.5s"/>
    <line class="h" x2="1200" y1="292" y2="292" style="animation-delay:-1.0s"/>
    <line class="h" x2="1200" y1="292" y2="292" style="animation-delay:-1.5s"/>
    <line class="h" x2="1200" y1="292" y2="292" style="animation-delay:-2.0s"/>
    <line class="h" x2="1200" y1="292" y2="292" style="animation-delay:-2.5s"/>
    <line class="h" x2="1200" y1="292" y2="292" style="animation-delay:-3.0s"/>
    <line class="h" x2="1200" y1="292" y2="292" style="animation-delay:-3.5s"/>
    <line class="h" x2="1200" y1="292" y2="292" style="animation-delay:-4.0s"/>
    </g>
    <line x1="0" y1="292" x2="1200" y2="292" stroke="url(#accent)" stroke-width="2.5" filter="url(#glow)" opacity="0.95"/>
    <rect x="0" y="291" width="1200" height="3" fill="#a5f3fc" opacity="0.35" filter="url(#blur)"/>

    <!-- Blockchain: links first so cubes sit on top -->
    <g fill="none" stroke-width="2" filter="url(#glow)">
      <path class="link" d="M 840 214 Q 870 198 895 188" stroke="#22d3ee"/>
      <path class="link" d="M 980 188 Q 1010 198 1035 214" stroke="#34d399"/>
    </g>
    
    <g class="float" style="animation-delay:0.0s">
      <ellipse cx="800" cy="268" rx="36" ry="7" fill="#22d3ee" opacity="0.25" filter="url(#blur)" class="shadow" style="animation-delay:0.0s"/>
      <polygon points="760,173 800,196 800,242 760,219" fill="url(#faceL)" stroke="#22d3ee" stroke-width="1.2"/>
      <polygon points="840,173 800,196 800,242 840,219" fill="url(#faceR)" stroke="#22d3ee" stroke-width="1.2"/>
      <polygon points="800,150 840,173 800,196 760,173" fill="url(#faceT)" stroke="#22d3ee" stroke-width="1.4"/>
      <polygon points="800,150 840,173 800,196 760,173" fill="none" stroke="#fff" stroke-width="1.6" opacity="0" class="edge" style="animation-delay:0.0s"/>
      <text x="800" y="178" text-anchor="middle" class="hash">0x7a</text>
      <text x="780" y="215" text-anchor="middle" class="tiny">TX</text>
    </g>
    <g class="float" style="animation-delay:0.6s">
      <ellipse cx="935" cy="240" rx="42" ry="7" fill="#34d399" opacity="0.25" filter="url(#blur)" class="shadow" style="animation-delay:0.6s"/>
      <polygon points="888,133 935,160 935,214 888,187" fill="url(#faceL)" stroke="#34d399" stroke-width="1.2"/>
      <polygon points="982,133 935,160 935,214 982,187" fill="url(#faceR)" stroke="#34d399" stroke-width="1.2"/>
      <polygon points="935,106 982,133 935,160 888,133" fill="url(#faceT)" stroke="#34d399" stroke-width="1.4"/>
      <polygon points="935,106 982,133 935,160 888,133" fill="none" stroke="#fff" stroke-width="1.6" opacity="0" class="edge" style="animation-delay:0.6s"/>
      <text x="935" y="138" text-anchor="middle" class="hash">0x3f</text>
      <text x="912" y="183" text-anchor="middle" class="tiny">TX</text>
    </g>
    <g class="float" style="animation-delay:1.2s">
      <ellipse cx="1075" cy="274" rx="34" ry="7" fill="#a78bfa" opacity="0.25" filter="url(#blur)" class="shadow" style="animation-delay:1.2s"/>
      <polygon points="1037,182 1075,204 1075,248 1037,226" fill="url(#faceL)" stroke="#a78bfa" stroke-width="1.2"/>
      <polygon points="1113,182 1075,204 1075,248 1113,226" fill="url(#faceR)" stroke="#a78bfa" stroke-width="1.2"/>
      <polygon points="1075,160 1113,182 1075,204 1037,182" fill="url(#faceT)" stroke="#a78bfa" stroke-width="1.4"/>
      <polygon points="1075,160 1113,182 1075,204 1037,182" fill="none" stroke="#fff" stroke-width="1.6" opacity="0" class="edge" style="animation-delay:1.2s"/>
      <text x="1075" y="187" text-anchor="middle" class="hash">0xc1</text>
      <text x="1056" y="222" text-anchor="middle" class="tiny">TX</text>
    </g>

    <!-- Orbit ring around the middle block, with a satellite that goes behind it -->
    <g transform="translate(935 188)">
      <ellipse rx="128" ry="30" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="2 6"/>
      <g>
        <circle r="11" fill="#a78bfa" opacity="0.25"/>
        <circle r="4.5" fill="#f5f3ff"/>
        <animateMotion dur="5s" repeatCount="indefinite" path="M128,0 A128,30 0 1,1 -128,0 A128,30 0 1,1 128,0"/>
        <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.45;0.55;0.95;1" dur="5s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Copy -->
    <text x="80" y="66" class="tag in d1">// BACKEND · WEB3 · FINTECH</text>
    <rect x="80" y="82" width="64" height="4" rx="2" fill="url(#accent)" class="in d1"/>
    <g class="in d2" filter="url(#soft)">
      <text x="78" y="150" class="name" fill="url(#shine)">Siddharth</text>
      <text x="78" y="208" class="name" fill="url(#shine)">Maddheshiya</text>
    </g>
    <text x="80" y="244" class="role in d3">Building money-moving systems · MERN · Solidity</text>

    <g class="in d4">
      <g clip-path="url(#typeClip)">
        <text x="80" y="276" class="mono">$ node payouts.js --chain bsc --settle instant ✓</text>
      </g>
      <rect class="blink" x="80" y="262" width="9" height="18" fill="#34d399">
        <animate attributeName="x" values="80;550;550;80" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Scanline sweep -->
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#67e8f9" opacity="0.06"/>
    <rect width="1200" height="440" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>
  </g>
</svg>
