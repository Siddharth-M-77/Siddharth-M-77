name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "30 18 * * *" # Daily at 00:00 IST
  workflow_dispatch: # Allow manual runs from the Actions tab

permissions:
  contents: write # Needed to push the generated SVGs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          git commit -m "Generate 3D contribution graph" || echo "No changes to commit"
          git push
